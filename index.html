<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IV Radio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');
    
    body {
      margin: 0;
      background: #000000;
      color: #eee;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      overflow: hidden;
      overscroll-behavior: none; 
    }
    
    /* === SISTEMA DE TELAS === */
    .view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      animation: fadeIn 0.3s ease;
    }
    .view.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* === MENU INICIAL (EXPANSÕES) === */
    #menuTitle {
      font-size: 2rem;
      color: #ffaa00;
      margin-bottom: 40px;
      text-shadow: 0 0 10px rgba(255,170,0,0.5);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .menu-row { display: flex; gap: 20px; margin-bottom: 20px; }
    .btn-exp {
      background: #222; color: #fff; border: 2px solid #555;
      padding: 20px 40px; font-size: 1.2rem; font-family: inherit;
      cursor: pointer; border-radius: 8px; transition: all 0.3s;
      min-width: 250px; text-align: center; text-transform: uppercase;
    }
    .btn-exp:hover {
      background: #ffaa00; color: #000; border-color: #ffaa00;
      transform: scale(1.05); box-shadow: 0 0 15px rgba(255,170,0,0.6);
    }

    /* === TELA DO PLAYER (ÁREA INTERATIVA) === */
    #viewPlayer {
      cursor: grab;
      position: relative;
      touch-action: pan-y; 
      width: 100%;
    }
    #viewPlayer:active { cursor: grabbing; }

    #radioHeader {
      position: absolute;
      top: 40px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 90%;
      max-width: 1000px;
      z-index: 30;
      pointer-events: auto;
    }
    #btnBack {
      background: transparent; color: #aaa; border: 1px solid #aaa;
      padding: 8px 16px; font-family: inherit; cursor: pointer;
      border-radius: 4px; transition: 0.3s;
    }
    #btnBack:hover { background: #333; color: #fff; border-color: #fff; }


    /* === LAYOUT CENTRAL (GRUPO DE ALINHAMENTO) === */
    #playerCenterGroup {
      display: flex;
      flex-direction: column;
      align-items: center; 
      width: 100%;
      z-index: 20;
    }

    /* === CAPA E TÍTULO === */
    #coverAndTitle {
      display: flex;
      flex-direction: column; 
      align-items: flex-start; 
      gap: 15px; 
      margin-bottom: 50px; 
      width: 100%;
      max-width: 382px; 
    }

    #activeColorLogo {
      width: 280px; 
      height: 120px; 
      object-fit: contain;
      object-position: left bottom; 
      opacity: 0;
      transform: scale(0.95);
      transform-origin: left bottom; 
      -webkit-user-drag: none;
      
      /* Transição padrão como "none" para fade-out seco */
      transition: none; 
    }
    
    /* Aplica a animação suave APENAS no fade-in */
    #activeColorLogo.visible {
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.3s ease, transform 0.3s ease; 
    }

    #radioNameText {
      font-size: 1.1rem;
      white-space: nowrap;
      color: #ffaa00;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255,170,0,0.4);
      padding-bottom: 0; 
      
      /* Recuo para o texto ficar perfeitamente alinhado com o visual da logo colorida */
      padding-left: 15px; 

      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease; 
    }
    #radioNameText.visible {
      opacity: 1;
      transform: translateX(0);
    }
    #radioNameText.fade-out {
      opacity: 0 !important;
    }

    /* === CARROSSEL DAS RÁDIOS === */
    #carouselContainer {
      position: relative;
      width: 100%;
      height: 100px; 
      display: block;
      transition: opacity 0.3s ease; 
      opacity: 1;
      overflow: visible; 
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.4) 15%, black 30%, black 70%, rgba(0,0,0,0.4) 85%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.4) 15%, black 30%, black 70%, rgba(0,0,0,0.4) 85%, transparent 100%);
    }
    
    #carouselContainer.hidden-carousel {
      opacity: 0;
    }

    .radio-card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 128px;
      height: 64px;
      margin-left: -64px;
      margin-top: -32px;  
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    
    .radio-card img {
      width: 128px;
      height: 64px;
      object-fit: contain;
      -webkit-user-drag: none;
    }

    /* === ÁREA DE LOGS === */
    #logArea {
      position: absolute;
      bottom: 20px;
      width: 90%; max-width: 600px; height: 120px;
      background: #111; border: 1px solid #333; padding: 10px;
      font-family: monospace; font-size: 0.8rem; color: #0f0;
      overflow-y: auto; border-radius: 8px; box-sizing: border-box;
      pointer-events: auto; 
    }
    #logArea div { border-bottom: 1px solid #222; padding: 2px 0; }
  </style>
</head>
<body>

  <div id="viewMenu" class="view active">
    <div id="menuTitle">Selecione a Programação</div>
    <div class="menu-row">
      <button class="btn-exp" data-exp="iv">IV</button>
      <button class="btn-exp" data-exp="eflc">EFLC</button>
    </div>
    <div class="menu-row">
      <button class="btn-exp" data-exp="complete">Complete Edition</button>
    </div>
  </div>

  <div id="viewPlayer" class="view">
    <div id="radioHeader">
      <button id="btnBack">⬅ Voltar</button>
    </div>

    <div id="playerCenterGroup">
      
      <div id="coverAndTitle">
        <img id="activeColorLogo" src="capas/default.png" draggable="false" />
        <div id="radioNameText"></div>
      </div>

      <div id="carouselContainer"></div>

    </div>

    <div id="logArea"></div>
  </div>

  <script src="geral.js"></script>
  <script src="station.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="renderer.js"></script>
  
  <script>
    // ----------------- SISTEMA DE LOGS -----------------
    const logArea = document.getElementById('logArea');
    const oldLog = console.log;
    console.log = (...args) => {
      oldLog(...args);
      const line = document.createElement('div');
      line.textContent = args.join(' ');
      logArea.appendChild(line);
      logArea.scrollTop = logArea.scrollHeight;
    };

    // ----------------- SONS DA INTERFACE -----------------
    const uiAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let clickBuffer = null;
    let staticBuffer = null;
    let staticSource = null;
    let staticGain = null;

    function forceWakeUpAudio() {
        if (uiAudioCtx.state !== 'running') uiAudioCtx.resume();
        const osc = uiAudioCtx.createOscillator();
        const gain = uiAudioCtx.createGain();
        gain.gain.value = 0; 
        osc.connect(gain);
        gain.connect(uiAudioCtx.destination);
        osc.start();
        osc.stop(uiAudioCtx.currentTime + 0.01);
    }
    ['click', 'touchstart'].forEach(e => document.addEventListener(e, forceWakeUpAudio, {once:true}));

    fetch('RADIO_CLICK.ogg').then(r=>r.arrayBuffer()).then(ab=>uiAudioCtx.decodeAudioData(ab)).then(b=>clickBuffer=b).catch(()=>{});
    fetch('RADIO_STATIC_LOOP.ogg').then(r=>r.arrayBuffer()).then(ab=>uiAudioCtx.decodeAudioData(ab)).then(b=>staticBuffer=b).catch(()=>{});

    function playUIClick() {
        forceWakeUpAudio();
        if (!clickBuffer) return;
        const src = uiAudioCtx.createBufferSource();
        src.buffer = clickBuffer;
        const gain = uiAudioCtx.createGain();
        gain.gain.value = 3.0; 
        src.connect(gain);
        gain.connect(uiAudioCtx.destination);
        src.start();
    }

    function playUIStatic() {
        forceWakeUpAudio();
        if (!staticBuffer) return;
        if (staticSource) stopUIStatic(true); 
        
        staticSource = uiAudioCtx.createBufferSource();
        staticSource.buffer = staticBuffer;
        staticSource.loop = true;
        
        staticGain = uiAudioCtx.createGain();
        staticGain.gain.value = 0.4; 
        
        staticSource.connect(staticGain);
        staticGain.connect(uiAudioCtx.destination);
        staticSource.start();
    }

    function stopUIStatic(immediate = false) {
        if (!staticSource || !staticGain) return;
        const srcToStop = staticSource;
        const gainToFade = staticGain;
        staticSource = null;
        staticGain = null;

        if (immediate) {
            try { srcToStop.stop(); } catch(e){}
            return;
        }

        const now = uiAudioCtx.currentTime;
        gainToFade.gain.cancelScheduledValues(now);
        gainToFade.gain.setValueAtTime(gainToFade.gain.value, now);
        gainToFade.gain.linearRampToValueAtTime(0.001, now + 0.4); 
        setTimeout(() => { try { srcToStop.stop(); } catch(e){} }, 400);
    }

    // ----------------- CONFIGURAÇÃO DAS RÁDIOS -----------------
    const todasAsRadios = [
      { key: 'radio_afro_beat', name: 'International Funk 99', imgBW: 'capas/if99_bw.png', imgCol: 'capas/if99_col.png', expansoes: ['iv', 'complete'], artWidth: 115 },
      { key: 'radio_babylon', name: 'Tuff Gong Radio', imgBW: 'capas/tuffgong_bw.png', imgCol: 'capas/tuffgong_col.png', expansoes: ['iv', 'complete'], artWidth: 110 },
      { key: 'radio_the_vibe', name: 'The Vibe 98.8', imgBW: 'capas/thevibe_bw.png', imgCol: 'capas/thevibe_col.png', expansoes: ['iv', 'complete'], artWidth: 105 },
      { key: 'radio_liberty_rock', name: 'Liberty Rock Radio 97.8', imgBW: 'capas/lrr_bw.png', imgCol: 'capas/lrr_col.png', expansoes: ['iv', 'eflc', 'complete'], artWidth: 75 },
      { key: 'radio_jazz_nation', name: 'Jazz Nation Radio 108.5', imgBW: 'capas/jnr_bw.png', imgCol: 'capas/jnr_col.png', expansoes: ['iv', 'complete'], artWidth: 90 }, 
      { key: 'radio_bobby_konders', name: 'Massive B Soundsystem 96.9', imgBW: 'capas/massiveb_bw.png', imgCol: 'capas/massiveb_col.png', expansoes: ['iv', 'complete'], artWidth: 90 }, 
      { key: 'radio_meditation', name: 'Self Actualization FM', imgBW: 'capas/selfactualizationfm_bw.png', imgCol: 'capas/selfactualizationfm_col.png', expansoes: ['eflc', 'complete'], artWidth: 75 },
      { key: 'radio_k109_the_studio', name: 'K109 The Studio', imgBW: 'capas/k109_bw.png', imgCol: 'capas/k109_col.png', expansoes: ['iv', 'eflc', 'complete'], artWidth: 85 },
      { key: 'radio_vcfm', name: 'Vice City FM', imgBW: 'capas/vicecityfm_bw.png', imgCol: 'capas/vicecityfm_col.png', expansoes: ['eflc', 'complete'], artWidth: 75 },
      { key: 'radio_wktt', name: 'We Know The Truth', imgBW: 'capas/wktt_bw.png', imgCol: 'capas/wktt_col.png', expansoes: ['iv', 'eflc', 'complete'], artWidth: 90 },
      { key: 'radio_hardcore', name: 'Liberty City Hardcore', imgBW: 'capas/lchc_bw.png', imgCol: 'capas/lchc_col.png', expansoes: ['iv', 'eflc', 'complete'], artWidth: 110 },
      { key: 'radio_classical_ambient', name: 'The Journey', imgBW: 'capas/thejourney_bw.png', imgCol: 'capas/thejourney_col.png', expansoes: ['iv', 'complete'], artWidth: 110 },
      { key: 'radio_fusion_fm', name: 'Fusion FM', imgBW: 'capas/fusion_bw.png', imgCol: 'capas/fusion_col.png', expansoes: ['iv', 'complete'], artWidth: 105 },
      { key: 'radio_beat_95', name: 'The Beat 102.7', imgBW: 'capas/beat_bw.png', imgCol: 'capas/beat_col.png', expansoes: ['iv', 'eflc', 'complete'], artWidth: 90 }, 
      { key: 'radio_ramjamfm', name: 'Ram Jam FM', imgBW: 'capas/ramjamfm_bw.png', imgCol: 'capas/ramjamfm_col.png', expansoes: ['eflc', 'complete'], artWidth: 110 },
      { key: 'radio_dance_rock', name: 'Radio Broker', imgBW: 'capas/radiobroker_bw.png', imgCol: 'capas/radiobroker_col.png', expansoes: ['iv', 'eflc', 'complete'], artWidth: 110 },
      { key: 'radio_vladivostok', name: 'Vladivostok FM', imgBW: 'capas/vladivostok_bw.png', imgCol: 'capas/vladivostok_col.png', expansoes: ['iv', 'eflc', 'complete'], artWidth: 80 },
      { key: 'radio_plr', name: 'Public Liberty Radio', imgBW: 'capas/plr_bw.png', imgCol: 'capas/plr_col.png', expansoes: ['iv', 'complete'], artWidth: 90 },
      { key: 'radio_san_juan_sounds', name: 'San Juan Sounds', imgBW: 'capas/sanjuan_bw.png', imgCol: 'capas/sanjuan_col.png', expansoes: ['iv', 'eflc', 'complete'], artWidth: 85 },
      { key: 'radio_dance_mix', name: 'Electro Choc', imgBW: 'capas/electrochoc_bw.png', imgCol: 'capas/electrochoc_col.png', expansoes: ['iv', 'eflc', 'complete'], artWidth: 115 },
      { key: 'radio_ny_classics', name: 'The Classics 104.1', imgBW: 'capas/theclassics_bw.png', imgCol: 'capas/theclassics_col.png', expansoes: ['iv', 'complete'], artWidth: 110 },
      { 
        key: 'radio_lazlow', 
        name: 'Integrity 2.0', 
        imgBW: 'capas/integrity_bw.png', 
        imgCol: 'capas/integrity_col.png', 
        expansoes: ['iv', 'eflc', 'complete'], 
        artWidth: 115,
        isAvailable: function(exp, day) {
            if (exp === 'eflc') return true; 
            return day >= 8; 
        }
      }
    ];

    // ----------------- ESTADO GLOBAL -----------------
    let currentExpansion = null;
    let radiosAtuais = [];
    let currentIndex = 0; 
    let playTimeout = null;
    let carouselIdleTimeout = null;
    let currentlyPlayingKey = null; 
    let isRadioLoading = false; 

    const viewMenu = document.getElementById('viewMenu');
    const viewPlayer = document.getElementById('viewPlayer');
    const carouselContainer = document.getElementById('carouselContainer');
    const activeColorLogo = document.getElementById('activeColorLogo');
    const radioNameText = document.getElementById('radioNameText');

    function scheduleCarouselHide() {
      clearTimeout(carouselIdleTimeout);
      carouselIdleTimeout = setTimeout(() => {
        carouselContainer.classList.add('hidden-carousel');
        radioNameText.classList.add('fade-out'); 
      }, 1000); 
    }

    function wakeUpCarousel() {
      carouselContainer.classList.remove('hidden-carousel');
      radioNameText.classList.remove('fade-out'); 
      clearTimeout(carouselIdleTimeout);
    }

    function buildCarousel() {
      const day = new Date().getDate(); 
      radiosAtuais = todasAsRadios.filter(r => {
          const validExpansion = r.expansoes.includes(currentExpansion);
          const validDate = r.isAvailable ? r.isAvailable(currentExpansion, day) : true;
          return validExpansion && validDate;
      });
      
      carouselContainer.innerHTML = ''; 

      radiosAtuais.forEach((r, index) => {
        const div = document.createElement('div');
        div.className = 'radio-card';
        div.id = `card_${index}`;
        
        let imgSrcBw = r.imgBW;
        if (currentExpansion === 'eflc') {
            if (r.key === 'radio_beat_95') imgSrcBw = 'capas/beat_bw2.png';
            else if (r.key === 'radio_dance_rock') imgSrcBw = 'capas/radiobroker_bw2.png';
            else if (r.key === 'radio_hardcore') imgSrcBw = 'capas/lchc_bw2.png';
            else if (r.key === 'radio_liberty_rock') imgSrcBw = 'capas/lrr_bw2.png';
        }

        div.innerHTML = `<img src="${imgSrcBw}" draggable="false" onerror="this.src='capas/default.png'" />`;
        carouselContainer.appendChild(div);
      });
    }

    function updateCarousel(isFirstLoad = false) {
      wakeUpCarousel(); 

      const N = radiosAtuais.length;
      if(N === 0) return;
      
      const activeIdx = ((currentIndex % N) + N) % N;
      const rad = radiosAtuais[activeIdx];

      activeColorLogo.classList.remove('visible');
      radioNameText.textContent = rad.name;
      radioNameText.classList.add('visible');

      if (!isFirstLoad) playUIClick();

      // === MOTOR DE ESPAÇAMENTO GEOMÉTRICO (CORRIGIDO) ===
      const getW = (offset) => radiosAtuais[((activeIdx + offset) % N + N) % N].artWidth;
      
      const GAP = 18; 

      // LADO ESQUERDO
      const pos1_left = (getW(0) / 2) + GAP + (getW(-1) / 2);
      const pos2_left = pos1_left + (getW(-1) / 2) + GAP + (getW(-2) / 2);
      const pos3_left = pos2_left + 150;

      // LADO DIREITO
      const pos1_right = (getW(0) / 2) + GAP + (getW(1) / 2);
      const pos2_right = pos1_right + (getW(1) / 2) + GAP + (getW(2) / 2);
      const pos3_right = pos2_right + 150;

      document.querySelectorAll('.radio-card').forEach((el, i) => {
        let diff = i - activeIdx;
        
        if (diff > Math.floor(N/2)) diff -= N;
        if (diff < -Math.floor(N/2)) diff += N;

        let targetX = 0;
        if (diff === 1) targetX = pos1_right;
        else if (diff === -1) targetX = -pos1_left;
        else if (diff === 2) targetX = pos2_right;
        else if (diff === -2) targetX = -pos2_left;
        else if (diff > 2) targetX = pos3_right;
        else if (diff < -2) targetX = -pos3_left;

        const oldX = el.dataset.prevX !== undefined ? parseFloat(el.dataset.prevX) : targetX;
        el.dataset.prevX = targetX;

        if ((oldX < -100 && targetX > 100) || (oldX > 100 && targetX < -100)) {
            el.style.transition = 'none';
            el.style.transform = `translateX(${targetX}px)`;
            void el.offsetWidth; 
        }

        el.style.transition = 'transform 0.15s ease-out, opacity 0.15s ease-out';

        let opacity = '0';
        let zIdx = '1';
        
        if (diff === 0) { opacity = '1'; zIdx = '5'; }
        else if (Math.abs(diff) === 1) { opacity = '0.5'; zIdx = '4'; } 
        else if (Math.abs(diff) === 2) { opacity = '0.15'; zIdx = '3'; } 

        el.style.transform = `translateX(${targetX}px)`;
        el.style.opacity = opacity;
        el.style.zIndex = zIdx;
      });

      clearTimeout(playTimeout);
      playTimeout = setTimeout(() => {
        clearTimeout(carouselIdleTimeout); 

        const imgLoader = new Image();
        imgLoader.onload = () => {
            activeColorLogo.src = rad.imgCol;
            if (!isRadioLoading) {
                activeColorLogo.classList.add('visible');
            }
        };
        imgLoader.src = rad.imgCol;
        
        if (currentlyPlayingKey !== rad.key) {
            isRadioLoading = true;
            playUIStatic();

            if(window.__RADIO && window.__RADIO.stopRadio) window.__RADIO.stopRadio();
            
            if(window.__RADIO && window.__RADIO.startRadio) {
              currentlyPlayingKey = rad.key;
              window.__RADIO.startRadio(currentExpansion, rad.key);
              
              const stopStaticHandler = () => {
                  isRadioLoading = false;
                  stopUIStatic(false);
                  window.removeEventListener('radio-ready', stopStaticHandler);
                  clearTimeout(safetyTimeout); 
                  
                  activeColorLogo.classList.add('visible');
                  scheduleCarouselHide();
              };

              window.addEventListener('radio-ready', stopStaticHandler);
              const safetyTimeout = setTimeout(() => { stopStaticHandler(); }, 15000);

            } else {
              isRadioLoading = false;
              stopUIStatic(true);
              scheduleCarouselHide();
            }
        } else {
            if (!isRadioLoading) scheduleCarouselHide(); 
        }
      }, 1000);
    }

    function goNext() { currentIndex++; updateCarousel(); }
    function goPrev() { currentIndex--; updateCarousel(); }

    // ----------------- EVENTOS DE INTERAÇÃO -----------------
    document.querySelectorAll('.btn-exp').forEach(btn => {
      btn.addEventListener('click', (e) => {
        forceWakeUpAudio(); 
        
        currentExpansion = e.target.getAttribute('data-exp');
        
        viewMenu.classList.remove('active');
        viewPlayer.classList.add('active');
        
        buildCarousel();
        currentIndex = 0; 

        const firstRad = radiosAtuais[0];
        if(window.__RADIO && window.__RADIO.startRadio) {
            isRadioLoading = true;
            currentlyPlayingKey = firstRad.key; 
            window.__RADIO.startRadio(currentExpansion, firstRad.key);
            
            const firstLoadHandler = () => {
                isRadioLoading = false;
                window.removeEventListener('radio-ready', firstLoadHandler);
                
                activeColorLogo.classList.add('visible');
                scheduleCarouselHide(); 
            };
            window.addEventListener('radio-ready', firstLoadHandler);
        }

        updateCarousel(true); 
      });
    });

    document.getElementById('btnBack').addEventListener('click', (e) => {
      e.stopPropagation(); 
      clearTimeout(playTimeout);
      clearTimeout(carouselIdleTimeout);
      
      if(window.__RADIO && window.__RADIO.stopRadio) window.__RADIO.stopRadio();
      
      currentlyPlayingKey = null; 
      isRadioLoading = false;
      stopUIStatic(true); 

      activeColorLogo.style.transition = 'none'; 
      activeColorLogo.classList.remove('visible');
      activeColorLogo.src = 'capas/default.png'; 
      radioNameText.style.transition = 'none';
      radioNameText.classList.remove('visible');
      
      void activeColorLogo.offsetWidth; 
      
      activeColorLogo.style.transition = ''; 
      radioNameText.style.transition = '';

      viewPlayer.classList.remove('active');
      viewMenu.classList.add('active');
    });

    let lastWheelTime = 0;
    viewPlayer.addEventListener('wheel', (e) => {
      forceWakeUpAudio();
      if (e.target.closest('#logArea')) return; 

      e.preventDefault(); 
      const now = Date.now();
      if (now - lastWheelTime < 250) return; 
      lastWheelTime = now;
      if (e.deltaY > 0) goNext(); 
      else if (e.deltaY < 0) goPrev(); 
    }, { passive: false });

    let isDragging = false, startX = 0, startY = 0;

    const dragStart = (e) => { 
      forceWakeUpAudio();
      if (e.target.closest('#logArea') || e.target.closest('#btnBack')) return;
      isDragging = true; 
      const touch = e.type.includes('mouse') ? e : e.changedTouches[0];
      startX = touch.clientX; 
      startY = touch.clientY;
    };

    const dragEnd = (e) => {
      if (!isDragging) return;
      isDragging = false;
      
      const touch = e.type.includes('mouse') ? e : e.changedTouches[0];
      const diffX = startX - touch.clientX;
      const diffY = startY - touch.clientY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
          if (diffX > 50) goNext();
          else if (diffX < -50) goPrev();
          else {
              wakeUpCarousel(); 
              scheduleCarouselHide();
          }
      } else {
          wakeUpCarousel();
          scheduleCarouselHide();
      }
    };

    viewPlayer.addEventListener('mousedown', dragStart);
    viewPlayer.addEventListener('mouseup', dragEnd);
    viewPlayer.addEventListener('mouseleave', (e) => { if(isDragging) dragEnd(e); });
    
    viewPlayer.addEventListener('touchstart', dragStart, { passive: true });
    viewPlayer.addEventListener('touchend', dragEnd);

  </script>
</body>
</html>
